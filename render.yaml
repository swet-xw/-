services:
  - type: web
    name: image-platform-api
    runtime: node
    plan: free
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build:api:prod
    preDeployCommand: npm run deploy:api:migrate
    startCommand: npm run start:api:prod
    healthCheckPath: /generation/providers
    envVars:
      - key: NODE_VERSION
        value: 22.22.3
      - key: GENERATION_WORKER_CONCURRENCY
        value: 3
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: image-platform-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: image-platform-redis
          property: connectionString
      - key: DEV_API_KEY
        sync: false
      - key: DEV_OWNER_EMAIL
        sync: false
      - key: DEV_MONTHLY_IMAGE_QUOTA
        value: 1000
      - key: OPENAI_API_KEY
        sync: false
      - key: STABILITY_API_KEY
        sync: false
      - key: CUSTOM_PROVIDER_URL
        sync: false
      - key: CUSTOM_PROVIDER_TOKEN
        sync: false

  - type: keyvalue
    name: image-platform-redis
    plan: free
    ipAllowList: []

databases:
  - name: image-platform-postgres
    plan: free
    databaseName: image_platform
    user: image_platform
